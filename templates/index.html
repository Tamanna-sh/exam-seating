{% extends "base.html" %}
{% block title %}Find Your Seat{% endblock %}
{% block content %}
<div class="card hero">
  <h2>Find Your Exam Seat</h2>
  <p>Enter your name or roll number to get your room, bench and seat.</p>
  <form action="/find" method="get">
    <input type="text" name="q" placeholder="Name or roll number" required>
    <button type="submit">Search</button>
  </form>
</div>
<div class="card noprint" style="text-align:center;">
  <a class="btn" href="/generate">Full seating plan</a>
  <a class="btn" href="/stats">Statistics</a>
</div>
{% endblock %}
